name: Daily Market Briefing

on:
  schedule:
    - cron: '30 4 * * 1-5'   # 04:30 UTC = 05:30 ora italiana (ora solare)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Briefing, Audio & HTML History
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        run: python build_briefing.py

      - name: Commit updated history and site
        run: |
          git config user.name "MarketBot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "Briefing mercati $(date +'%Y-%m-%d')"
          git push
