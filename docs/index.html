<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morning Market Briefing &amp; Podcast</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --amber: #d29922;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 16px;
      max-width: 920px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    h1 { font-size: 1.35rem; font-weight: 700; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    select, button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover, select:hover { border-color: var(--accent); }
    button.active { background: var(--accent); color: #0d1117; font-weight: 600; border-color: var(--accent); }
    .player-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    audio { width: 100%; height: 42px; margin-top: 6px; }
    .speed-btns button { padding: 4px 10px; font-size: 0.8rem; }
    .hero {
      margin-bottom: 20px;
      padding: 16px;
      background: linear-gradient(135deg, #161b22 0%, #1c2432 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      margin-bottom: 8px;
    }
    .hero h2 { font-size: 1.4rem; margin-bottom: 4px; }
    .slides-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .slide-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }
    .slide-cat {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .slide-card h3 { font-size: 1.15rem; margin-bottom: 8px; }
    .takeaway {
      background: rgba(255,255,255,0.04);
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: #c9d1d9;
    }
    ul { padding-left: 20px; }
    li { margin-bottom: 6px; font-size: 0.95rem; }
    .archive-list { display: flex; flex-direction: column; gap: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>📈 Rassegna Mercati</h1>
    <div class="controls">
      <select id="dateSelect" aria-label="Seleziona data"></select>
      <button id="btnDayView" class="active" onclick="setView('day')">Giorno</button>
      <button id="btnMonthView" onclick="setView('month')">Storico Ultimo Mese</button>
    </div>
  </header>

  <div id="dayView">
    <div class="player-box">
      <div class="player-top">
        <strong>🎧 Podcast Mattutino (Modalità Auto)</strong>
        <div class="speed-btns">
          <button onclick="setSpeed(1)">1x</button>
          <button onclick="setSpeed(1.25)">1.25x</button>
          <button onclick="setSpeed(1.5)">1.5x</button>
        </div>
      </div>
      <audio id="audioPlayer" controls preload="metadata"></audio>
    </div>

    <div class="hero">
      <span class="badge" id="sentimentBadge"></span>
      <h2 id="dayHeadline"></h2>
      <div style="color: var(--muted); font-size: 0.9rem;" id="dayDateLabel"></div>
    </div>

    <div class="slides-grid" id="slidesContainer"></div>
  </div>

  <div id="monthView" class="hidden">
    <h2 style="margin-bottom: 14px; font-size: 1.2rem;">Archivio ultimi 30+ giorni</h2>
    <div class="archive-list" id="archiveContainer"></div>
  </div>

  <script>
    const HISTORY = [{"date": "2026-11-23", "date_label": "23/11/2026", "audio_path": "audio/2026-11-23.mp3", "day_headline": "Effetto Nvidia spinge i listini tech, Brent sotto novanta dollari", "market_sentiment": "Risk-On", "slides": [{"category": "Azionario", "headline": "Nvidia balza del 30% con il reingresso del CEO Jensen Huang", "key_takeaway": "Il ritorno di Huang riaccende la fiducia sul comparto dei semiconduttori e trascina al rialzo l'intero settore tecnologico.", "bullets": ["Reintegro lampo di Jensen Huang come presidente e amministratore delegato dopo soli undici giorni dalla sua uscita.", "Il titolo Nvidia guadagna oltre il trenta percento al Nasdaq, registrando uno dei maggiori rialzi dell'ultimo decennio.", "CrowdStrike annuncia l'acquisizione di Zscaler con una transazione azionaria da circa quarantaquattro miliardi di dollari."]}, {"category": "Macro & Banche Centrali", "headline": "PIL statunitense stimato al 3% nel quarto trimestre 2026", "key_takeaway": "La domanda dei consumatori negli Stati Uniti mostra resilienza sostenendo le prospettive di crescita a fine anno.", "bullets": ["Stime di S&P Global indicano un'espansione dell'economia americana al tre percento su base annua nel finale di esercizio.", "JPMorgan testa transazioni finanziarie automatizzate gestite da agenti d'intelligenza artificiale senza intervento umano.", "Sotto pressione i titoli delle assicurazioni sanitarie americane per la revisione delle valutazioni Medicare Advantage."]}, {"category": "Materie Prime & Valute", "headline": "Petrolio Brent sotto novanta dollari e dollaro in rafforzamento", "key_takeaway": "La flessione dei prezzi energetici attenua le pressioni inflazionistiche, mentre l'euro arretra a 1,09 sul dollaro.", "bullets": ["Prezzo del greggio Brent in calo al di sotto dei novanta dollari al barile sui mercati internazionali.", "Rafforzamento del dollaro americano che spinge il cambio Euro/Dollaro al ribasso a quota uno virgola zero nove.", "Sconti mirati della grande distribuzione americana per stimolare i consumi in vista delle festività."]}, {"category": "Italia & Europa", "headline": "Milano positiva nonostante i dividendi, Lego investe in Portogallo", "key_takeaway": "Piazza Affari assorbe lo stacco delle cedole e chiude in rialzo dello 0,65%.", "bullets": ["Indice FTSE MIB a più zero virgola sessantacinque percento nonostante il peso dello stacco dividendi per l'uno virgola quarantuno percento.", "Lego annuncia un investimento di un miliardo di dollari per la costruzione di una nuova fabbrica in Portogallo.", "Julius Baer segna un utile record ma delude sui nuovi flussi netti, scesi a otto virgola cinque miliardi di franchi svizzeri."]}], "podcast_script": "Buongiorno e benvenuti al nostro appuntamento quotidiano con i mercati finanziari. Oggi ventitré novembre duemilaventisei assistiamo a una giornata dominata dal forte ottimismo sul settore tecnologico globale, guidata dal clamoroso ritorno di Jensen Huang alla guida di Nvidia. Il consiglio di amministrazione del colosso dei microchip ha infatti reintegrato Huang come presidente e amministratore delegato soltanto undici giorni dopo la sua uscita. La notizia ha scatenato un forte rally a Wall Street, con il titolo Nvidia arrivato a guadagnare oltre il trenta percento. L'effetto si è riflesso su tutto il comparto tecnologico, rassicurando gli investitori sulla continuità strategica nello sviluppo dell'intelligenza artificiale. Sempre nel settore tecnologico si segnala un'operazione da record: CrowdStrike ha annunciato l'acquisizione di Zscaler per un valore di circa quarantatré virgola nove miliardi di dollari interamente in azioni. Sul fronte bancario, JPMorgan sta sviluppando transazioni finanziarie gestite da agenti di intelligenza artificiale capaci di operare senza intervento umano. Passando allo scenario macroeconomico, gli ultimi indicatori segnalano una solida tenuta degli Stati Uniti, con stime di crescita del prodotto interno lordo intorno al tre percento per il quarto trimestre, sostenute dalla resilienza dei consumi. Sul fronte delle materie prime, il petrolio Brent scende sotto la soglia dei novanta dollari al barile, offrendo un leggero respiro alle pressioni inflazionistiche. Il dollaro guadagna terreno, spingendo il cambio con l'euro verso quota uno virgola zero nove. In Europa la seduta si chiude con segnali positivi. Piazza Affari registra un rialzo dello zero virgola sessantacinque percento, un risultato particolarmente solido se si considera che la giornata ha visto lo stacco delle cedole per nove grandi società, con un impatto stimato nell'uno virgola quarantuno percento sull'indice principale. Tra le storie societarie del continente si evidenzia la mossa di Lego, che ha annunciato un investimento da un miliardo di dollari per un nuovo sito produttivo in Portogallo. A Zurigo, il gruppo bancario Julius Baer presenta un quadro contrastato: nonostante un utile netto record nei primi dieci mesi dell'anno, la banca ha registrato afflussi netti pari a otto virgola cinque miliardi di franchi svizzeri, un dato inferiore alle aspettative degli analisti. I mercati iniziano dunque la settimana con un ritrovato propensione al rischio, sostenuti dai grandi colossi tech. Per questo briefing è tutto, vi auguro una proficua giornata e buon lavoro."}];
    const dateSelect = document.getElementById("dateSelect");
    const audioPlayer = document.getElementById("audioPlayer");

    HISTORY.forEach((item, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = `${item.date_label} — ${item.day_headline}`;
      dateSelect.appendChild(opt);
    });

    function renderDay(index) {
      const item = HISTORY[index];
      if (!item) return;
      document.getElementById("sentimentBadge").textContent = `Sentiment: ${item.market_sentiment}`;
      document.getElementById("dayHeadline").textContent = item.day_headline;
      document.getElementById("dayDateLabel").textContent = item.date_label;
      audioPlayer.src = item.audio_path;

      const container = document.getElementById("slidesContainer");
      container.innerHTML = "";
      item.slides.forEach((slide, i) => {
        const card = document.createElement("div");
        card.className = "slide-card";
        const bulletsHtml = slide.bullets.map(b => `<li>${b}</li>`).join("");
        card.innerHTML = `
          <div class="slide-cat">Slide ${i + 1}/${item.slides.length} • ${slide.category}</div>
          <h3>${slide.headline}</h3>
          <div class="takeaway"><strong>Impatto:</strong> ${slide.key_takeaway}</div>
          <ul>${bulletsHtml}</ul>
        `;
        container.appendChild(card);
      });
    }

    function renderArchive() {
      const container = document.getElementById("archiveContainer");
      container.innerHTML = "";
      HISTORY.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "slide-card";
        const topics = item.slides.map(s => `<li><strong>${s.category}:</strong> ${s.headline} — <em>${s.key_takeaway}</em></li>`).join("");
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span class="slide-cat">${item.date_label} • ${item.market_sentiment}</span>
            <button onclick="openDayFromArchive(${idx})">Apri briefing &amp; audio →</button>
          </div>
          <h3 style="margin-bottom:10px;">${item.day_headline}</h3>
          <ul>${topics}</ul>
        `;
        container.appendChild(card);
      });
    }

    function openDayFromArchive(idx) {
      dateSelect.value = idx;
      renderDay(idx);
      setView("day");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setView(mode) {
      const isDay = mode === "day";
      document.getElementById("dayView").classList.toggle("hidden", !isDay);
      document.getElementById("monthView").classList.toggle("hidden", isDay);
      document.getElementById("btnDayView").classList.toggle("active", isDay);
      document.getElementById("btnMonthView").classList.toggle("active", !isDay);
      if (!isDay) renderArchive();
    }

    function setSpeed(rate) {
      audioPlayer.playbackRate = rate;
    }

    dateSelect.addEventListener("change", (e) => renderDay(e.target.value));
    renderDay(0);
  </script>
</body>
</html>
