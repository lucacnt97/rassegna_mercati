<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rassegna Mercati</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230d1117'/%3E%3Cpath d='M96 352l112-112 80 80 128-144' fill='none' stroke='%2358a6ff' stroke-width='44' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M336 176h80v80' fill='none' stroke='%233fb950' stroke-width='44' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230d1117'/%3E%3Cpath d='M96 352l112-112 80 80 128-144' fill='none' stroke='%2358a6ff' stroke-width='44' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M336 176h80v80' fill='none' stroke='%233fb950' stroke-width='44' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 16px;
      max-width: 920px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    h1 { font-size: 1.35rem; font-weight: 700; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    select, button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover, select:hover { border-color: var(--accent); }
    button.active { background: var(--accent); color: #0d1117; font-weight: 600; border-color: var(--accent); }
    .player-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    audio { width: 100%; height: 42px; margin-top: 6px; }
    .speed-btns button { padding: 4px 10px; font-size: 0.8rem; }
    .sources-banner {
      background: rgba(88, 166, 255, 0.08);
      border: 1px solid rgba(88, 166, 255, 0.28);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 0.88rem;
      color: #c9d1d9;
    }
    .sources-banner strong { color: var(--accent); }
    .source-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .source-pill {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      color: var(--text);
    }
    .hero {
      margin-bottom: 20px;
      padding: 16px;
      background: linear-gradient(135deg, #161b22 0%, #1c2432 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      margin-bottom: 8px;
    }
    .hero h2 { font-size: 1.4rem; margin-bottom: 4px; }
    .slides-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .slide-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }
    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }
    .slide-cat {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 700;
    }
    .slide-src {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .slide-card h3 { font-size: 1.15rem; margin-bottom: 8px; }
    .takeaway {
      background: rgba(255,255,255,0.04);
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: #c9d1d9;
    }
    ul { padding-left: 20px; }
    li { margin-bottom: 6px; font-size: 0.95rem; }
    .archive-list { display: flex; flex-direction: column; gap: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>📈 Rassegna Mercati</h1>
    <div class="controls">
      <select id="dateSelect" aria-label="Seleziona data"></select>
      <button id="btnDayView" class="active" onclick="setView('day')">Giorno</button>
      <button id="btnMonthView" onclick="setView('month')">Storico Ultimo Mese</button>
    </div>
  </header>

  <div id="dayView">
    <div class="player-box">
      <div class="player-top">
        <strong>🎧 Briefing Audio Mattutino (Modalità Auto)</strong>
        <div class="speed-btns">
          <button onclick="setSpeed(1)">1x</button>
          <button onclick="setSpeed(1.25)">1.25x</button>
          <button onclick="setSpeed(1.5)">1.5x</button>
        </div>
      </div>
      <audio id="audioPlayer" controls preload="metadata"></audio>
    </div>

    <div class="sources-banner">
      <strong>📰 Fonti consultate per questa rassegna:</strong>
      <div class="source-pills" id="sourcesContainer"></div>
    </div>

    <div class="hero">
      <span class="badge" id="sentimentBadge"></span>
      <h2 id="dayHeadline"></h2>
      <div style="color: var(--muted); font-size: 0.9rem;" id="dayDateLabel"></div>
    </div>

    <div class="slides-grid" id="slidesContainer"></div>
  </div>

  <div id="monthView" class="hidden">
    <h2 style="margin-bottom: 14px; font-size: 1.2rem;">Archivio ultimi 30+ giorni</h2>
    <div class="archive-list" id="archiveContainer"></div>
  </div>

  <script>
    const HISTORY = [{"date": "2026-11-23", "date_label": "23/11/2026", "audio_path": "audio/2026-11-23.mp3", "day_headline": "Il ritorno di Huang in Nvidia riaccende il Risk-On globale", "market_sentiment": "Risk-On", "active_sources": ["Il Sole 24 Ore - Finanza", "Il Sole 24 Ore - Economia", "ANSA Economia", "ANSA Mondo & Geopolitica", "Reuters Business", "Bloomberg Markets", "Financial Times", "Morningstar", "CNBC Top News", "MarketWatch Top Stories", "Oro & Commodities", "Mercati Emergenti", "Investing.com Italia"], "slides": [{"category": "1. Tema del Giorno", "headline": "Nvidia reintegra Jensen Huang e sblocca il rally dell'Intelligenza Artificiale", "key_takeaway": "Il ritorno del fondatore alla guida di Nvidia riduce l'incertezza sul comparto tech e ripristina la fiducia sul mercato azionario.", "bullets": ["Il consiglio di amministrazione di Nvidia reintegra Jensen Huang dopo soli undici giorni dalla sua uscita", "Wall Street e i titoli legati all'intelligenza artificiale mettono a segno un forte rimbalzo corale", "Gli analisti ritengono che la mossa ponga una solida base per stabilizzare il settore tecnologico"], "sources": ["Il Sole 24 Ore - Finanza", "Financial Times", "Reuters Business", "Bloomberg Markets", "CNBC Top News"]}, {"category": "2. Macro, Tassi & Geopolitica", "headline": "Dollaro in rialzo sulle aspettative dei tassi ed euro in calo a 1,09", "key_takeaway": "La forza del biglietto verde e le attese sui tassi americani mettono sotto pressione l'euro.", "bullets": ["Il cambio euro dollaro scende verso quota 1,09 a causa del costante rafforzamento della valuta statunitense", "Goldman Sachs prevede che il rally del dollaro proseguira prima di stabilizzarsi nel lungo periodo", "Contesto geopolitico monitorato con attenzione tra allarmi sicurezza in Europa e tensioni internazionali"], "sources": ["Il Sole 24 Ore - Finanza", "Reuters Business", "Bloomberg Markets", "Investing.com Italia", "ANSA Mondo & Geopolitica"]}, {"category": "3. Azionario Globale", "headline": "Wall Street trascina i listini mondiali, la Corea del Sud stabilizza il KOSPI", "key_takeaway": "Azionario sviluppato in netto recupero, mentre le autorita asiatiche intervengono sulla volatilita.", "bullets": ["Gli indici americani ed europei guidano la seduta con forte propensione al rischio", "La Corea del Sud promette interventi di sostegno dopo una flessione del 5 percento dell'indice KOSPI", "I gestori globali mantengono l'esposizione sull'azionario sviluppato riducendo le coperture difensive"], "sources": ["Reuters Business", "Financial Times", "Morningstar", "Bloomberg Markets"]}, {"category": "4. Rotazione & Focus Settori", "headline": "Big Tech in grande spolvero, soffrono i beni di consumo primario", "key_takeaway": "Rotazione dei capitali dai settori difensivi al comparto ad alta crescita tecnologica.", "bullets": ["Nvidia, Anthropic e Palo Alto Networks guidano i rialzi nel comparto tecnologico e della sicurezza", "Vendite sui beni di consumo di base come Kroger e Tyson Foods in seguito all'uscita dai titoli rifugio", "JPMorgan accelera nell'integrazione di agenti d'intelligenza artificiale per le operazioni finanziarie"], "sources": ["MarketWatch Top Stories", "Bloomberg Markets", "Investing.com Italia", "CNBC Top News"]}, {"category": "5. Oro & Materie Prime", "headline": "L'oro risale sopra 3.600 dollari, il petrolio Brent scivola sotto i 90 dollari", "key_takeaway": "L'oro ritrova supporto sulle correzioni, mentre l'energia riflette la riorganizzazione dei flussi.", "bullets": ["Il metallo prezioso recupera terreno portandosi oltre i 3.600 dollari dopo i recenti cali", "Goldman Sachs mantiene una visione rialzista di lungo termine sull'oro con target a 4.650 dollari", "Il greggio Brent si riposiziona sotto i 90 dollari al barile per l'aumento della liquidita di mercato"], "sources": ["Reuters Business", "Bloomberg Markets", "Oro & Commodities", "Il Sole 24 Ore - Finanza"]}, {"category": "6. Mercati Emergenti", "headline": "Dollaro forte sui flussi emergenti, l'India sale al 14,7% negli indici", "key_takeaway": "Il dollaro solido frena i capitali verso i mercati emergenti, ma l'India guadagna peso strategico.", "bullets": ["La quota dell'India nell'indice MSCI Emerging Markets raggiunge il 14,7 percento grazie ai flussi esteri", "Il Brasile taglia le stime di crescita per il 2027 al 1,8 percento e avvia ristrutturazioni societarie", "La Cina acquista oro per compensare un avanzo commerciale record da mille miliardi di dollari"], "sources": ["Mercati Emergenti", "Investing.com Italia", "Bloomberg Markets", "Oro & Commodities"]}, {"category": "7. Focus Italia", "headline": "Piazza Affari sale dello 0,65% riassorbendo lo stacco dei dividendi", "key_takeaway": "Il FTSE MIB dimostra tenuta nonostante le sfide della crescita economica complessiva.", "bullets": ["Il listino milanese chiude in positivo assorbendo lo stacco cedole di nove big pari a 1,41 percento di peso", "Goldman Sachs stima il PIL italiano allo 0,8 percento quest'anno e allo 0,5 percento nel prossimo", "Uno studio della BCE rileva ostacoli al credito doppi per le imprese italiane rispetto al nord Europa"], "sources": ["Il Sole 24 Ore - Finanza", "ANSA Economia", "Morningstar"]}], "podcast_script": "Buongiorno e benvenuti al nostro briefing finanziario del mattino del ventitre novembre duemilaventisei. Oggi esaminiamo i quadri di mercato analizzando le notizie raccolte dalle principali testate finanziarie, tra cui Il Sole Ventiquattrore Finanza ed Economia, ANSA Economia e Mondo, Reuters Business, Bloomberg Markets, Financial Times, Morningstar, CNBC, MarketWatch, Oro e Commodities, Mercati Emergenti e Investing dot com Italia. La notizia principale che domina i mercati e riaccende la propensione al rischio a livello globale riguarda il reintegro di Jensen Huang alla guida di Nvidia. A soli undici giorni dalla sua uscita, il consiglio di amministrazione ha richiamato il fondatore alla carica di presidente e amministratore delegato. Questa decisione ha azzerato l'incertezza sul colosso dei chip e ha innescato un forte rimbalzo di Wall Street e di tutto il comparto legato all'intelligenza artificiale. Passando al quadro macroeconomico, la forza dell'economia e della tecnologia americana mantiene elevati i rendimenti negli Stati Uniti. Il dollaro continua la sua spinta, mentre l'euro cede terreno scendendo verso quota uno virgola zero nove. Gli analisti di Goldman Sachs sottolineano come il biglietto verde possa mantenere questa forza prima di un modesto ritracciamento nei prossimi mesi. Nel frattempo il contesto geopolitico rimane sotto attenta osservazione per una serie di allarmi di sicurezza in Europa e tensioni in Medio Oriente. Per quanto riguarda l'azionario globale, assistiamo a una seduta positiva nei listini sviluppati di America ed Europa, mentre in Asia le autorita della Corea del Sud sono intervenute con misure di sostegno per stabilizzare il listino KOSPI dopo un calo del cinque per cento. Sul fronte della rotazione settoriale, i capitali si stanno spostando con decisione verso i titoli tecnologici ad alta crescita come Nvidia, Anthropic e Palo Alto Networks. Al contrario, soffrono i settori piu difensivi come i consumi di base, con cali su titoli come Kroger e Tyson Foods. Nel comparto finanziario da segnalare l'accelerazione di JPMorgan sull'integrazione di agenti di intelligenza artificiale per l'automazione delle transazioni. Dando uno sguardo alle materie prime e ai beni rifugio, l'oro ha ritrovato brillantezza risalendo sopra i tremila seicento dollari all'oncia grazie agli acquisti sulla debolezza. Le case d'affari confermano stime rialziste di lungo termine fino a quattromila seicento cinquanta dollari entro il duemilaventisette. Il petrolio Brent invece scivola leggermente sotto i novanta dollari al barile. Nei mercati emergenti la forza del dollaro condiziona i flussi di capitale, ma si nota il consolidamento dell'India, il cui peso nell'indice MSCI Emerging Markets sale al quattordici virgola sette per cento. In America Latina il Brasile rivede al ribasso la crescita attesa per il duemilaventisette all'uno virgola otto per cento. Chiudiamo con il focus sull'Italia. Piazza Affari mostra una buona resilienza chiudendo in rialzo dello zero virgola sessantacinque per cento e riassorbendo perfettamente lo stacco di dividendi di nove grandi societa che pesava per l'uno virgola quarantuno per cento sull'indice principale. Sul fronte economico Goldman Sachs stima la crescita del prodotto interno lordo italiano allo zero virgola otto per cento per quest'anno e allo zero virgola cinque per cento per il prossimo, mentre la Banca Centrale Europea rileva come le imprese italiane debbano affrontare ostacoli finanziari piu elevati rispetto a quelle del Nord Europa. Per oggi e tutto, vi auguro una buona giornata e un buon lavoro."}];
    const dateSelect = document.getElementById("dateSelect");
    const audioPlayer = document.getElementById("audioPlayer");

    HISTORY.forEach((item, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = `${item.date_label} — ${item.day_headline}`;
      dateSelect.appendChild(opt);
    });

    function renderDay(index) {
      const item = HISTORY[index];
      if (!item) return;
      document.getElementById("sentimentBadge").textContent = `Sentiment: ${item.market_sentiment}`;
      document.getElementById("dayHeadline").textContent = item.day_headline;
      document.getElementById("dayDateLabel").textContent = item.date_label;
      audioPlayer.src = item.audio_path;

      const sourcesContainer = document.getElementById("sourcesContainer");
      const sourcesList = item.active_sources || [
        "Il Sole 24 Ore", "Milano Finanza", "ANSA Economia", "Reuters", "Bloomberg", "Financial Times", "Morningstar"
      ];
      sourcesContainer.innerHTML = sourcesList.map(s => `<span class="source-pill">${s}</span>`).join("");

      const container = document.getElementById("slidesContainer");
      container.innerHTML = "";
      item.slides.forEach((slide, i) => {
        const card = document.createElement("div");
        card.className = "slide-card";
        const bulletsHtml = slide.bullets.map(b => `<li>${b}</li>`).join("");
        const srcTag = (slide.sources && slide.sources.length) ? `Fonti: ${slide.sources.join(", ")}` : "";
        card.innerHTML = `
          <div class="slide-header">
            <span class="slide-cat">Slide ${i + 1}/${item.slides.length} • ${slide.category}</span>
            <span class="slide-src">${srcTag}</span>
          </div>
          <h3>${slide.headline}</h3>
          <div class="takeaway"><strong>Impatto:</strong> ${slide.key_takeaway}</div>
          <ul>${bulletsHtml}</ul>
        `;
        container.appendChild(card);
      });
    }

    function renderArchive() {
      const container = document.getElementById("archiveContainer");
      container.innerHTML = "";
      HISTORY.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "slide-card";
        const topics = item.slides.map(s => `<li><strong>${s.category}:</strong> ${s.headline} — <em>${s.key_takeaway}</em></li>`).join("");
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span class="slide-cat">${item.date_label} • ${item.market_sentiment}</span>
            <button onclick="openDayFromArchive(${idx})">Apri briefing &amp; audio →</button>
          </div>
          <h3 style="margin-bottom:10px;">${item.day_headline}</h3>
          <ul>${topics}</ul>
        `;
        container.appendChild(card);
      });
    }

    function openDayFromArchive(idx) {
      dateSelect.value = idx;
      renderDay(idx);
      setView("day");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setView(mode) {
      const isDay = mode === "day";
      document.getElementById("dayView").classList.toggle("hidden", !isDay);
      document.getElementById("monthView").classList.toggle("hidden", isDay);
      document.getElementById("btnDayView").classList.toggle("active", isDay);
      document.getElementById("btnMonthView").classList.toggle("active", !isDay);
      if (!isDay) renderArchive();
    }

    function setSpeed(rate) {
      audioPlayer.playbackRate = rate;
    }

    dateSelect.addEventListener("change", (e) => renderDay(e.target.value));
    renderDay(0);
  </script>
</body>
</html>
