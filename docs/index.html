<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morning Market Briefing &amp; Podcast</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 16px;
      max-width: 920px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    h1 { font-size: 1.35rem; font-weight: 700; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    select, button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover, select:hover { border-color: var(--accent); }
    button.active { background: var(--accent); color: #0d1117; font-weight: 600; border-color: var(--accent); }
    .player-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    audio { width: 100%; height: 42px; margin-top: 6px; }
    .speed-btns button { padding: 4px 10px; font-size: 0.8rem; }
    .sources-banner {
      background: rgba(88, 166, 255, 0.08);
      border: 1px solid rgba(88, 166, 255, 0.28);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 0.88rem;
      color: #c9d1d9;
    }
    .sources-banner strong { color: var(--accent); }
    .source-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .source-pill {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      color: var(--text);
    }
    .hero {
      margin-bottom: 20px;
      padding: 16px;
      background: linear-gradient(135deg, #161b22 0%, #1c2432 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      margin-bottom: 8px;
    }
    .hero h2 { font-size: 1.4rem; margin-bottom: 4px; }
    .slides-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .slide-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }
    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }
    .slide-cat {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 700;
    }
    .slide-src {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .slide-card h3 { font-size: 1.15rem; margin-bottom: 8px; }
    .takeaway {
      background: rgba(255,255,255,0.04);
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: #c9d1d9;
    }
    ul { padding-left: 20px; }
    li { margin-bottom: 6px; font-size: 0.95rem; }
    .archive-list { display: flex; flex-direction: column; gap: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>📈 Rassegna Mercati</h1>
    <div class="controls">
      <select id="dateSelect" aria-label="Seleziona data"></select>
      <button id="btnDayView" class="active" onclick="setView('day')">Giorno</button>
      <button id="btnMonthView" onclick="setView('month')">Storico Ultimo Mese</button>
    </div>
  </header>

  <div id="dayView">
    <div class="player-box">
      <div class="player-top">
        <strong>🎧 Podcast Mattutino (Modalità Auto)</strong>
        <div class="speed-btns">
          <button onclick="setSpeed(1)">1x</button>
          <button onclick="setSpeed(1.25)">1.25x</button>
          <button onclick="setSpeed(1.5)">1.5x</button>
        </div>
      </div>
      <audio id="audioPlayer" controls preload="metadata"></audio>
    </div>

    <div class="sources-banner">
      <strong>📰 Fonti consultate per questa rassegna:</strong>
      <div class="source-pills" id="sourcesContainer"></div>
    </div>

    <div class="hero">
      <span class="badge" id="sentimentBadge"></span>
      <h2 id="dayHeadline"></h2>
      <div style="color: var(--muted); font-size: 0.9rem;" id="dayDateLabel"></div>
    </div>

    <div class="slides-grid" id="slidesContainer"></div>
  </div>

  <div id="monthView" class="hidden">
    <h2 style="margin-bottom: 14px; font-size: 1.2rem;">Archivio ultimi 30+ giorni</h2>
    <div class="archive-list" id="archiveContainer"></div>
  </div>

  <script>
    const HISTORY = [{"date": "2026-11-23", "date_label": "23/11/2026", "audio_path": "audio/2026-11-23.mp3", "day_headline": "Ritorno di Huang spinge i tech, ma pesano incertezze macro", "market_sentiment": "Risk-On", "active_sources": ["Il Sole 24 Ore - Finanza", "Il Sole 24 Ore - Economia", "ANSA Economia", "Reuters Business", "Financial Times", "CNBC Top News", "MarketWatch Top Stories", "Investing.com Italia"], "slides": [{"category": "Azionario", "headline": "Ritorno di Jensen Huang alla guida di Nvidia: rally sui tech", "key_takeaway": "Il reintegro del CEO alla guida di Nvidia riaccende l'entusiasmo degli investitori sul settore tecnologico globale.", "bullets": ["Nvidia guadagna oltre il 30% a Wall Street dopo la reintegrazione del co-fondatore.", "Wall Street e borse europee in forte rialzo trascinate dall'effetto intelligenza artificiale.", "Gli analisti di Wedbush ritengono che la mossa metta un punto fermo alle vendite sul settore."], "sources": ["Il Sole 24 Ore - Finanza", "Financial Times", "Reuters Business", "CNBC Top News", "MarketWatch Top Stories", "Investing.com Italia"]}, {"category": "Italia & Europa", "headline": "Piazza Affari giù per dividendi; Goldman frena su Pil italiano", "key_takeaway": "Milano cede terreno a causa dello stacco cedole mentre Goldman Sachs riduce le stime di crescita dell'Italia.", "bullets": ["Milano cede lo 0,64% per lo stacco cedole di 9 big che ha impattato per l'1,41%.", "Goldman Sachs prevede crescita italiana allo 0,8% nel 2026 e 0,5% nel 2027.", "Studio Bce rileva che le imprese italiane affrontano ostacoli finanziari doppi rispetto ai Paesi del Nord."], "sources": ["Il Sole 24 Ore - Finanza", "ANSA Economia"]}, {"category": "Materie Prime & Valute", "headline": "Oro in ripresa sopra il 2%, petrolio Brent in calo", "key_takeaway": "L'oro approfitta della pausa del dollaro per rimbalzare, mentre il petrolio scende sotto i 90 dollari.", "bullets": ["Prezzo del Brent in flessione al di sotto dei 90 dollari al barile.", "Quotazioni dell'oro in rialzo di oltre il 2% grazie al rallentamento del biglietto verde.", "L'euro si indebolisce nei confronti del dollaro toccando quota 1,09."], "sources": ["Il Sole 24 Ore - Finanza", "Reuters Business", "ANSA Economia"]}, {"category": "Macro & Banche Centrali", "headline": "Francia valuta regola aurea in Costituzione per frenare la spesa", "key_takeaway": "Macron propone vincoli costituzionali sui conti pubblici di fronte al rischio di stime di crescita inferiori alle attese.", "bullets": ["Proposta di riforma costituzionale per fissare un tetto alla spesa pubblica francese.", "Ministro delle Finanze avverte sul rischio di taglio della stima del Pil 2027 attualmente all'1%.", "Crescono le preoccupazioni della Bce sui divari finanziari interni all'Eurozona."], "sources": ["Financial Times", "Reuters Business"]}, {"category": "Azionario", "headline": "CrowdStrike acquisisce Zscaler per 44 miliardi nel settore cyber", "key_takeaway": "Mega fusione interamente azionaria nella cybersecurity per creare un gigante integrato contro le minacce informatiche.", "bullets": ["Operazione da 44 miliardi di dollari interamente in azioni per far fronte all'aumento degli attacchi informatici.", "Forte domanda nel settore software nonostante la volatilità dei mercati azionari.", "Nel settore pharma Novartis frena gli entusiasmi di chi prevede una cura rapida per il cancro tramite intelligenza artificiale."], "sources": ["Financial Times"]}], "podcast_script": "MARCO: Buongiorno e benvenuti al nostro briefing finanziario di oggi, lunedì ventitré novembre duemilaventisei. Oggi abbiamo analizzato per voi le notizie di Il Sole Ventiquattr'Ore Finanza, Il Sole Ventiquattr'Ore Economia, ANSA Economia, Reuters Business, Financial Times, CNBC Top News, MarketWatch Top Stories e Investing punto com Italia. Ciao Elena, giornata piena di colpi di scena sui mercati. ELENA: Ciao Marco e buongiorno a tutti. La notizia della giornata è senza dubbio il clamoroso ritorno di Jensen Huang alla guida di Nvidia come presidente e amministratore delegato. Il consiglio di amministrazione ha fatto un passo indietro e i mercati hanno risposto con un rally spettacolare. MARCO: Esatto, le azioni Nvidia sono volate di oltre il trenta percento sul listino americano e l'effetto positivo ha spinto al rialzo l'indice S and P cinquecento, il Nasdaq e i listini europei. Gli analisti di Wall Street vedono questo reintegro come un segnale di stabilizzazione per tutto il comparto dell'intelligenza artificiale. ELENA: Passando all'Europa e all'Italia, a Piazza Affari l'indice principale ha chiuso in calo dello zero virgola sessantaquattro percento, ma l'effetto è dovuto solo allo stacco cedole di nove grandi società che ha pesato per l'uno virgola quarantuno percento. Sul fronte macro, Goldman Sachs ha ridotto le stime di crescita per il nostro Paese allo zero virgola otto percento quest'anno e allo zero virgola cinque percento nel duemilasette. MARCO: Inoltre, uno studio della Banca Centrale Europea evidenzia che le imprese italiane affrontano ostacoli di credito doppi rispetto a quelle del Nord Europa, rilanciando la necessità di un'Unione dei mercati dei capitali. In Francia intanto, il presidente Macron ha proposto di inserire una regola aurea di bilancio in Costituzione per limitare la spesa pubblica. ELENA: Diamo un'occhiata a valute e materie prime, Marco. Il petrolio Brent è sceso sotto i novanta dollari al barile, mentre l'oro ha registrato un balzo di oltre il due percento grazie alla pausa del rally del dollaro. L'euro resta invece debole attorno a uno virgola zero nove sul dollaro. MARCO: Da segnalare infine una maxi operazione nel settore tecnologico, con CrowdStrike che ha annunciato l'acquisizione di Zscaler per quarantaquattro miliardi di dollari in azioni, creando un colosso senza precedenti nella sicurezza informatica. ELENA: Una mossa strategica di grande impatto. Per oggi è tutto, buon viaggio e buona giornata a tutti gli ascoltatori."}];
    const dateSelect = document.getElementById("dateSelect");
    const audioPlayer = document.getElementById("audioPlayer");

    HISTORY.forEach((item, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = `${item.date_label} — ${item.day_headline}`;
      dateSelect.appendChild(opt);
    });

    function renderDay(index) {
      const item = HISTORY[index];
      if (!item) return;
      document.getElementById("sentimentBadge").textContent = `Sentiment: ${item.market_sentiment}`;
      document.getElementById("dayHeadline").textContent = item.day_headline;
      document.getElementById("dayDateLabel").textContent = item.date_label;
      audioPlayer.src = item.audio_path;

      const sourcesContainer = document.getElementById("sourcesContainer");
      const sourcesList = item.active_sources || [
        "Il Sole 24 Ore", "Milano Finanza", "ANSA Economia", "Reuters", "Financial Times", "CNBC", "MarketWatch"
      ];
      sourcesContainer.innerHTML = sourcesList.map(s => `<span class="source-pill">${s}</span>`).join("");

      const container = document.getElementById("slidesContainer");
      container.innerHTML = "";
      item.slides.forEach((slide, i) => {
        const card = document.createElement("div");
        card.className = "slide-card";
        const bulletsHtml = slide.bullets.map(b => `<li>${b}</li>`).join("");
        const srcTag = (slide.sources && slide.sources.length) ? `Fonti: ${slide.sources.join(", ")}` : "";
        card.innerHTML = `
          <div class="slide-header">
            <span class="slide-cat">Slide ${i + 1}/${item.slides.length} • ${slide.category}</span>
            <span class="slide-src">${srcTag}</span>
          </div>
          <h3>${slide.headline}</h3>
          <div class="takeaway"><strong>Impatto:</strong> ${slide.key_takeaway}</div>
          <ul>${bulletsHtml}</ul>
        `;
        container.appendChild(card);
      });
    }

    function renderArchive() {
      const container = document.getElementById("archiveContainer");
      container.innerHTML = "";
      HISTORY.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "slide-card";
        const topics = item.slides.map(s => `<li><strong>${s.category}:</strong> ${s.headline} — <em>${s.key_takeaway}</em></li>`).join("");
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span class="slide-cat">${item.date_label} • ${item.market_sentiment}</span>
            <button onclick="openDayFromArchive(${idx})">Apri briefing &amp; audio →</button>
          </div>
          <h3 style="margin-bottom:10px;">${item.day_headline}</h3>
          <ul>${topics}</ul>
        `;
        container.appendChild(card);
      });
    }

    function openDayFromArchive(idx) {
      dateSelect.value = idx;
      renderDay(idx);
      setView("day");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setView(mode) {
      const isDay = mode === "day";
      document.getElementById("dayView").classList.toggle("hidden", !isDay);
      document.getElementById("monthView").classList.toggle("hidden", isDay);
      document.getElementById("btnDayView").classList.toggle("active", isDay);
      document.getElementById("btnMonthView").classList.toggle("active", !isDay);
      if (!isDay) renderArchive();
    }

    function setSpeed(rate) {
      audioPlayer.playbackRate = rate;
    }

    dateSelect.addEventListener("change", (e) => renderDay(e.target.value));
    renderDay(0);
  </script>
</body>
</html>
