<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morning Market Briefing &amp; Podcast</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 16px;
      max-width: 920px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    h1 { font-size: 1.35rem; font-weight: 700; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    select, button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover, select:hover { border-color: var(--accent); }
    button.active { background: var(--accent); color: #0d1117; font-weight: 600; border-color: var(--accent); }
    .player-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    audio { width: 100%; height: 42px; margin-top: 6px; }
    .speed-btns button { padding: 4px 10px; font-size: 0.8rem; }
    .sources-banner {
      background: rgba(88, 166, 255, 0.08);
      border: 1px solid rgba(88, 166, 255, 0.28);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 0.88rem;
      color: #c9d1d9;
    }
    .sources-banner strong { color: var(--accent); }
    .source-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .source-pill {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      color: var(--text);
    }
    .hero {
      margin-bottom: 20px;
      padding: 16px;
      background: linear-gradient(135deg, #161b22 0%, #1c2432 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      margin-bottom: 8px;
    }
    .hero h2 { font-size: 1.4rem; margin-bottom: 4px; }
    .slides-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .slide-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }
    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }
    .slide-cat {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 700;
    }
    .slide-src {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .slide-card h3 { font-size: 1.15rem; margin-bottom: 8px; }
    .takeaway {
      background: rgba(255,255,255,0.04);
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: #c9d1d9;
    }
    ul { padding-left: 20px; }
    li { margin-bottom: 6px; font-size: 0.95rem; }
    .archive-list { display: flex; flex-direction: column; gap: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>📈 Rassegna Mercati</h1>
    <div class="controls">
      <select id="dateSelect" aria-label="Seleziona data"></select>
      <button id="btnDayView" class="active" onclick="setView('day')">Giorno</button>
      <button id="btnMonthView" onclick="setView('month')">Storico Ultimo Mese</button>
    </div>
  </header>

  <div id="dayView">
    <div class="player-box">
      <div class="player-top">
        <strong>🎧 Briefing Audio Mattutino (Modalità Auto)</strong>
        <div class="speed-btns">
          <button onclick="setSpeed(1)">1x</button>
          <button onclick="setSpeed(1.25)">1.25x</button>
          <button onclick="setSpeed(1.5)">1.5x</button>
        </div>
      </div>
      <audio id="audioPlayer" controls preload="metadata"></audio>
    </div>

    <div class="sources-banner">
      <strong>📰 Fonti consultate per questa rassegna:</strong>
      <div class="source-pills" id="sourcesContainer"></div>
    </div>

    <div class="hero">
      <span class="badge" id="sentimentBadge"></span>
      <h2 id="dayHeadline"></h2>
      <div style="color: var(--muted); font-size: 0.9rem;" id="dayDateLabel"></div>
    </div>

    <div class="slides-grid" id="slidesContainer"></div>
  </div>

  <div id="monthView" class="hidden">
    <h2 style="margin-bottom: 14px; font-size: 1.2rem;">Archivio ultimi 30+ giorni</h2>
    <div class="archive-list" id="archiveContainer"></div>
  </div>

  <script>
    const HISTORY = [{"date": "2026-11-23", "date_label": "23/11/2026", "audio_path": "audio/2026-11-23.mp3", "day_headline": "Il ritorno di Huang in Nvidia riaccende Wall Street", "market_sentiment": "Risk-On", "active_sources": ["Il Sole 24 Ore - Finanza", "Il Sole 24 Ore - Economia", "ANSA Economia", "Reuters Business", "Financial Times", "CNBC Top News", "MarketWatch Top Stories", "Investing.com Italia"], "slides": [{"category": "Azionario", "headline": "Nvidia balza in borsa con il clamoroso reintegro del CEO Jensen Huang", "key_takeaway": "Il ritorno del fondatore arresta il sell-off sul settore tech e trascina al rialzo Wall Street.", "bullets": ["Nvidia segna un rialzo superiore al 30% a Wall Street dopo l'annuncio del board.", "CrowdStrike acquisisce Zscaler con un'operazione azionaria da 44 miliardi di dollari.", "Wedbush e i principali analisti confermano il rating positivo sul titolo Nvidia."], "sources": ["Il Sole 24 Ore - Finanza", "Reuters Business", "Financial Times", "CNBC Top News", "MarketWatch Top Stories", "Investing.com Italia"]}, {"category": "Italia & Europa", "headline": "Stacco cedole pesa su Milano mentre Goldman Sachs frena sul PIL italiano", "key_takeaway": "Piazza Affari sconta il dividendo di nove big e la stima di crescita italiana scende allo 0,8%.", "bullets": ["L'indice milanese sconta l'impatto dell'1,41% legato allo stacco dei dividendi.", "Goldman Sachs prevede per l'Italia un PIL allo 0,8% nel 2026 e allo 0,5% per l'anno successivo.", "Un nuovo studio BCE rileva ostacoli finanziari doppi per le imprese italiane rispetto al Nord Europa."], "sources": ["Il Sole 24 Ore - Finanza", "ANSA Economia"]}, {"category": "Macro & Banche Centrali", "headline": "Macron propone una regola d'oro in Costituzione per frenare il deficit", "key_takeaway": "La Francia tenta di blindare i conti pubblici di fronte al rischio di stime di crescita al ribasso.", "bullets": ["Il presidente francese propone una riforma costituzionale sul tetto alla spesa pubblica.", "Il ministero dell'economia francese avverte sul rischio di revisione del PIL per il 2027.", "Negli Stati Uniti l'attività economica mostra una crescita stimata al 3% nel quarto trimestre."], "sources": ["Reuters Business", "Financial Times", "MarketWatch Top Stories"]}, {"category": "Materie Prime & Valute", "headline": "Petrolio Brent sotto 90 dollari e l'Euro ritraccia verso quota 1,09", "key_takeaway": "Calano le quotazioni energetiche mentre il dollaro si rafforza e l'oro tenta un recupero.", "bullets": ["Il barile di Brent scende al di sotto della soglia psicologica dei 90 dollari.", "L'euro perde terreno nei confronti del biglietto verde posizionandosi a 1,09 dollari.", "Il prezzo dell'oro riprende quota grazie agli acquisti su livelli di prezzo ritenuti convenienti."], "sources": ["Il Sole 24 Ore - Finanza", "ANSA Economia", "Reuters Business"]}], "podcast_script": "Buongiorno e benvenuti al nostro appuntamento finanziario del ventitré novembre duemilaventisei. Oggi il nostro briefing si basa sull'analisi delle notizie provenienti da Il Sole ventiquattr'ore Finanza, Il Sole ventiquattr'ore Economia, ANSA Economia, Reuters Business, Financial Times, CNBC Top News, MarketWatch Top Stories e Investing.com Italia. La notizia regina della giornata è senza dubbio il clamoroso ritorno di Jensen Huang alla guida di Nvidia. Il consiglio di amministrazione del colosso dei microchip ha reintegrato il suo fondatore a soli undici giorni dal licenziamento. La reazione dei mercati è stata immediata, con il titolo di Nvidia che è balzato di oltre il trenta percento a Wall Street, trascinando al rialzo l'intero comparto tecnologico e l'indice Nasdaq. Sempre nel settore tech spicca la maxi acquisizione di Zscaler da parte di CrowdStrike per un valore di quarantaquattro miliardi di dollari. Spostandoci in Italia e in Europa, la giornata su Piazza Affari è stata caratterizzata dallo stacco delle cedole di nove grandi società, un'operazione che ha pesato sull'indice principale per un uno virgola quarantuno percento, portando il dato finale a meno zero virgola sessantaquattro percento. A livello macroeconomico arrivano segnali di cautela da Goldman Sachs, che ha ridotto le stime di crescita per il Pil italiano allo zero virgola otto percento per quest'anno e allo zero virgola cinque percento per il prossimo, a causa dell'erosione del potere d'acquisto. Uno studio della Banca Centrale Europea evidenzia inoltre che le imprese italiane affrontano ostacoli finanziari doppi rispetto ai concorrenti del nord Europa. In Francia, il presidente Macron propone una riforma costituzionale per introdurre una regola d'oro sul bilancio con l'obiettivo di contenere la spesa pubblica. Sul fronte delle materie prime e dei cambi, registriamo una flessione del petrolio Brent, che scende sotto la soglia dei novanta dollari al barile, mentre il cambio euro dollaro vede la moneta unica scendere a quota uno virgola zero nove di fronte a un dollaro in forte rafforzamento. L'oro mostra invece segnali di recupero grazie agli acquisti sui minimi. Vi ringrazio per l'ascolto, vi auguro una buona giornata e un buon viaggio."}];
    const dateSelect = document.getElementById("dateSelect");
    const audioPlayer = document.getElementById("audioPlayer");

    HISTORY.forEach((item, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = `${item.date_label} — ${item.day_headline}`;
      dateSelect.appendChild(opt);
    });

    function renderDay(index) {
      const item = HISTORY[index];
      if (!item) return;
      document.getElementById("sentimentBadge").textContent = `Sentiment: ${item.market_sentiment}`;
      document.getElementById("dayHeadline").textContent = item.day_headline;
      document.getElementById("dayDateLabel").textContent = item.date_label;
      audioPlayer.src = item.audio_path;

      const sourcesContainer = document.getElementById("sourcesContainer");
      const sourcesList = item.active_sources || [
        "Il Sole 24 Ore", "Milano Finanza", "ANSA Economia", "Reuters", "Financial Times", "CNBC", "MarketWatch"
      ];
      sourcesContainer.innerHTML = sourcesList.map(s => `<span class="source-pill">${s}</span>`).join("");

      const container = document.getElementById("slidesContainer");
      container.innerHTML = "";
      item.slides.forEach((slide, i) => {
        const card = document.createElement("div");
        card.className = "slide-card";
        const bulletsHtml = slide.bullets.map(b => `<li>${b}</li>`).join("");
        const srcTag = (slide.sources && slide.sources.length) ? `Fonti: ${slide.sources.join(", ")}` : "";
        card.innerHTML = `
          <div class="slide-header">
            <span class="slide-cat">Slide ${i + 1}/${item.slides.length} • ${slide.category}</span>
            <span class="slide-src">${srcTag}</span>
          </div>
          <h3>${slide.headline}</h3>
          <div class="takeaway"><strong>Impatto:</strong> ${slide.key_takeaway}</div>
          <ul>${bulletsHtml}</ul>
        `;
        container.appendChild(card);
      });
    }

    function renderArchive() {
      const container = document.getElementById("archiveContainer");
      container.innerHTML = "";
      HISTORY.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "slide-card";
        const topics = item.slides.map(s => `<li><strong>${s.category}:</strong> ${s.headline} — <em>${s.key_takeaway}</em></li>`).join("");
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span class="slide-cat">${item.date_label} • ${item.market_sentiment}</span>
            <button onclick="openDayFromArchive(${idx})">Apri briefing &amp; audio →</button>
          </div>
          <h3 style="margin-bottom:10px;">${item.day_headline}</h3>
          <ul>${topics}</ul>
        `;
        container.appendChild(card);
      });
    }

    function openDayFromArchive(idx) {
      dateSelect.value = idx;
      renderDay(idx);
      setView("day");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setView(mode) {
      const isDay = mode === "day";
      document.getElementById("dayView").classList.toggle("hidden", !isDay);
      document.getElementById("monthView").classList.toggle("hidden", isDay);
      document.getElementById("btnDayView").classList.toggle("active", isDay);
      document.getElementById("btnMonthView").classList.toggle("active", !isDay);
      if (!isDay) renderArchive();
    }

    function setSpeed(rate) {
      audioPlayer.playbackRate = rate;
    }

    dateSelect.addEventListener("change", (e) => renderDay(e.target.value));
    renderDay(0);
  </script>
</body>
</html>
