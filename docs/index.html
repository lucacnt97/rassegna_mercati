<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morning Market Briefing &amp; Podcast</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 16px;
      max-width: 920px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    h1 { font-size: 1.35rem; font-weight: 700; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    select, button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover, select:hover { border-color: var(--accent); }
    button.active { background: var(--accent); color: #0d1117; font-weight: 600; border-color: var(--accent); }
    .player-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    audio { width: 100%; height: 42px; margin-top: 6px; }
    .speed-btns button { padding: 4px 10px; font-size: 0.8rem; }
    .sources-banner {
      background: rgba(88, 166, 255, 0.08);
      border: 1px solid rgba(88, 166, 255, 0.28);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 0.88rem;
      color: #c9d1d9;
    }
    .sources-banner strong { color: var(--accent); }
    .source-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .source-pill {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      color: var(--text);
    }
    .hero {
      margin-bottom: 20px;
      padding: 16px;
      background: linear-gradient(135deg, #161b22 0%, #1c2432 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      margin-bottom: 8px;
    }
    .hero h2 { font-size: 1.4rem; margin-bottom: 4px; }
    .slides-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .slide-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }
    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }
    .slide-cat {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 700;
    }
    .slide-src {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .slide-card h3 { font-size: 1.15rem; margin-bottom: 8px; }
    .takeaway {
      background: rgba(255,255,255,0.04);
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: #c9d1d9;
    }
    ul { padding-left: 20px; }
    li { margin-bottom: 6px; font-size: 0.95rem; }
    .archive-list { display: flex; flex-direction: column; gap: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>📈 Rassegna Mercati</h1>
    <div class="controls">
      <select id="dateSelect" aria-label="Seleziona data"></select>
      <button id="btnDayView" class="active" onclick="setView('day')">Giorno</button>
      <button id="btnMonthView" onclick="setView('month')">Storico Ultimo Mese</button>
    </div>
  </header>

  <div id="dayView">
    <div class="player-box">
      <div class="player-top">
        <strong>🎧 Podcast Mattutino (Marco &amp; Anna — Modalità Auto)</strong>
        <div class="speed-btns">
          <button onclick="setSpeed(1)">1x</button>
          <button onclick="setSpeed(1.25)">1.25x</button>
          <button onclick="setSpeed(1.5)">1.5x</button>
        </div>
      </div>
      <audio id="audioPlayer" controls preload="metadata"></audio>
    </div>

    <div class="sources-banner">
      <strong>📰 Fonti consultate per questa rassegna:</strong>
      <div class="source-pills" id="sourcesContainer"></div>
    </div>

    <div class="hero">
      <span class="badge" id="sentimentBadge"></span>
      <h2 id="dayHeadline"></h2>
      <div style="color: var(--muted); font-size: 0.9rem;" id="dayDateLabel"></div>
    </div>

    <div class="slides-grid" id="slidesContainer"></div>
  </div>

  <div id="monthView" class="hidden">
    <h2 style="margin-bottom: 14px; font-size: 1.2rem;">Archivio ultimi 30+ giorni</h2>
    <div class="archive-list" id="archiveContainer"></div>
  </div>

  <script>
    const HISTORY = [{"date": "2026-11-23", "date_label": "23/11/2026", "audio_path": "audio/2026-11-23.mp3", "day_headline": "Ritorno di Huang spinge i tech, prudenza sulla crescita europea", "market_sentiment": "Misto", "active_sources": ["Il Sole 24 Ore - Finanza", "Il Sole 24 Ore - Economia", "ANSA Economia", "Reuters Business", "Financial Times", "CNBC Top News", "MarketWatch Top Stories", "Investing.com Italia"], "slides": [{"category": "Azionario", "headline": "Clamoroso ritorno di Huang alla guida di Nvidia: il settore tech vola", "key_takeaway": "Il reintegro di Jensen Huang spinge il titolo Nvidia in rialzo di oltre il trenta percento e rianima il settore tecnologico globale.", "bullets": ["Nvidia registra un balzo azionario superiore al 30% dopo 11 giorni dall'allontanamento di Huang", "Il rally di Nvidia trascina il Nasdaq e i titoli tecnologici europei", "Gli analisti scommettono sulla stabilizzazione del settore legato ai chip e all'intelligenza artificiale"], "sources": ["Il Sole 24 Ore - Finanza", "Reuters Business", "Financial Times", "CNBC Top News", "MarketWatch Top Stories", "Investing.com Italia"]}, {"category": "Azionario", "headline": "Maximerger nella cybersicurezza: CrowdStrike acquisisce Zscaler per 44 miliardi", "key_takeaway": "L'operazione interamente in azioni consolida il settore della sicurezza informatica per fronteggiare i crescenti attacchi digitali.", "bullets": ["Valore complessivo dell'acquisizione fissato a 44 miliardi di dollari", "Transazione interamente azionaria per creare un colosso integrato nella protezione dati", "Mossa accelerata dal continuo aumento degli attacchi informatici a governi e imprese"], "sources": ["Financial Times"]}, {"category": "Italia & Europa", "headline": "Goldman Sachs frena sulla crescita italiana: Pil stimato allo zero virgola otto percento", "key_takeaway": "L'erosione del potere d'acquisto riduce lo slancio economico dell'Italia rispetto ai principali partner europei.", "bullets": ["Stima del Pil italiano allo 0,8% nel 2026 e allo 0,5% nel 2027", "Studio Bce evidenzia ostacoli finanziari doppi per le imprese italiane rispetto ai Paesi nordici", "La Francia valuta regole fiscali in Costituzione e rischia il taglio delle stime 2027"], "sources": ["ANSA Economia", "Reuters Business"]}, {"category": "Materie Prime & Valute", "headline": "Petrolio sotto novanta dollari e oro in ripresa con l'euro debole", "key_takeaway": "I mercati delle materie prime evidenziano dinamiche contrastanti tra il calo del greggio e il rimbalzo del metallo prezioso.", "bullets": ["Petrolio Brent in ribasso sotto i 90 dollari al barile", "Oro in salita di oltre il 2% per via della pausa nel rally del dollaro americano", "Euro debole a quota 1,09 dollari mentre la Corea del Sud interviene sul calo del Kospi"], "sources": ["Il Sole 24 Ore - Finanza", "Reuters Business", "ANSA Economia"]}], "podcast_script": "MARCO: Buongiorno e benvenuti al nostro appuntamento finanziario di oggi, lunedì ventitré novembre duemilaventisei. Con me c'è Anna. Oggi analizziamo le notizie da Il Sole Ventiquattr'Ore Finanza, Il Sole Ventiquattr'Ore Economia, Ansa Economia, Reuters Business, Financial Times, C N B C Top News, MarketWatch Top Stories e Investing punto com Italia. ANNA: Ciao Marco e un saluto a tutti gli ascoltatori. Partiamo subito dalla notizia che sta dominando i listini mondiali. Il consiglio di amministrazione di Nvidia ha reintegrato Jensen Huang come amministratore delegato, a soli undici giorni dal suo allontanamento. MARCO: Una mossa clamorosa, Anna. Il mercato ha reagito con un vero e proprio boato: il titolo di Nvidia è volato di oltre il trenta percento a Wall Street, trascinando al rialzo l'indice Nasdaq e l'intero comparto tecnologico globale. ANNA: Esatto, molti analisti parlano di un punto di svolta per la fiducia nel settore dell'intelligenza artificiale, anche se restano aperti i nodi sui costi dei centri dati e sugli investimenti futuri. MARCO: E sempre nel mondo della tecnologia segnaliamo una mega acquisizione. CrowdStrike acquisterà Zscaler per quarantaquattro miliardi di dollari in un'operazione interamente azionaria per creare un colosso della sicurezza informatica. ANNA: Decisamente una mossa strategica enorme. Spostandoci invece sull'economia reale europea, il quadro appare più cauto. Goldman Sachs ha tagliato le stime sulla crescita italiana, prevedendo un Prodotto Interno Lordo allo zero virgola otto percento quest'anno e allo zero virgola cinque percento nel prossimo. MARCO: A pesare è soprattutto l'erosione del potere d'acquisto dei consumatori. Inoltre uno studio della Banca Centrale Europea segnala che le imprese italiane affrontano ostacoli finanziari doppi rispetto a quelle del nord Europa. ANNA: Non va meglio in Francia, dove si ipotizzano regole di bilancio in Costituzione mentre si rivedono al ribasso le stime sulla crescita. Sul fronte materie prime, il petrolio Brent scende sotto i novanta dollari al barile, mentre l'oro guadagna oltre il due percento. MARCO: E a Milano l'indice principale soffre per lo stacco cedole di nove grandi titoli ma resiste grazie alla spinta dei tecnologici. Per oggi è tutto, grazie ad Anna e buon viaggio a chi è in ascolto. ANNA: Buona giornata e buon proseguimento a tutti."}];
    const dateSelect = document.getElementById("dateSelect");
    const audioPlayer = document.getElementById("audioPlayer");

    HISTORY.forEach((item, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = `${item.date_label} — ${item.day_headline}`;
      dateSelect.appendChild(opt);
    });

    function renderDay(index) {
      const item = HISTORY[index];
      if (!item) return;
      document.getElementById("sentimentBadge").textContent = `Sentiment: ${item.market_sentiment}`;
      document.getElementById("dayHeadline").textContent = item.day_headline;
      document.getElementById("dayDateLabel").textContent = item.date_label;
      audioPlayer.src = item.audio_path;

      const sourcesContainer = document.getElementById("sourcesContainer");
      const sourcesList = item.active_sources || [
        "Il Sole 24 Ore", "Milano Finanza", "ANSA Economia", "Reuters", "Financial Times", "CNBC", "MarketWatch"
      ];
      sourcesContainer.innerHTML = sourcesList.map(s => `<span class="source-pill">${s}</span>`).join("");

      const container = document.getElementById("slidesContainer");
      container.innerHTML = "";
      item.slides.forEach((slide, i) => {
        const card = document.createElement("div");
        card.className = "slide-card";
        const bulletsHtml = slide.bullets.map(b => `<li>${b}</li>`).join("");
        const srcTag = (slide.sources && slide.sources.length) ? `Fonti: ${slide.sources.join(", ")}` : "";
        card.innerHTML = `
          <div class="slide-header">
            <span class="slide-cat">Slide ${i + 1}/${item.slides.length} • ${slide.category}</span>
            <span class="slide-src">${srcTag}</span>
          </div>
          <h3>${slide.headline}</h3>
          <div class="takeaway"><strong>Impatto:</strong> ${slide.key_takeaway}</div>
          <ul>${bulletsHtml}</ul>
        `;
        container.appendChild(card);
      });
    }

    function renderArchive() {
      const container = document.getElementById("archiveContainer");
      container.innerHTML = "";
      HISTORY.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "slide-card";
        const topics = item.slides.map(s => `<li><strong>${s.category}:</strong> ${s.headline} — <em>${s.key_takeaway}</em></li>`).join("");
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span class="slide-cat">${item.date_label} • ${item.market_sentiment}</span>
            <button onclick="openDayFromArchive(${idx})">Apri briefing &amp; audio →</button>
          </div>
          <h3 style="margin-bottom:10px;">${item.day_headline}</h3>
          <ul>${topics}</ul>
        `;
        container.appendChild(card);
      });
    }

    function openDayFromArchive(idx) {
      dateSelect.value = idx;
      renderDay(idx);
      setView("day");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setView(mode) {
      const isDay = mode === "day";
      document.getElementById("dayView").classList.toggle("hidden", !isDay);
      document.getElementById("monthView").classList.toggle("hidden", isDay);
      document.getElementById("btnDayView").classList.toggle("active", isDay);
      document.getElementById("btnMonthView").classList.toggle("active", !isDay);
      if (!isDay) renderArchive();
    }

    function setSpeed(rate) {
      audioPlayer.playbackRate = rate;
    }

    dateSelect.addEventListener("change", (e) => renderDay(e.target.value));
    renderDay(0);
  </script>
</body>
</html>
